# Local-only overrides for this machine.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Why this exists instead of docker-compose.dev.yml:
#   - The app's host port comes from APP_PORT in .env (3001 on this machine, because 3000 is taken);
#     the base file publishes it, so this file does not repeat the mapping.
#   - No Google OAuth client is configured, so the app runs in development mode and the dev-only
#     /auth/dev-login route is enabled. Auxiliary services keep NODE_ENV=production (their env
#     validation rejects ALLOW_FIRST_LOGIN_ADMIN=true), so the flag is overridden back to false.
#   - There is no reverse proxy here; everything is plain HTTP on localhost.
services:
  postgres:
    ports: ["5433:5432"]

  minio:
    # The S3 API (9000) is published by the base file; this adds the console for browsing buckets.
    ports:
      - "9001:9001"

  app:
    environment:
      NODE_ENV: development
      ALLOW_FIRST_LOGIN_ADMIN: "true"

  migrate:
    environment:
      ALLOW_FIRST_LOGIN_ADMIN: "false"

  ws:
    environment:
      ALLOW_FIRST_LOGIN_ADMIN: "false"

  worker:
    environment:
      ALLOW_FIRST_LOGIN_ADMIN: "false"

  # On-demand demo data seeder. Built from the Dockerfile "build" stage because the runtime
  # image only ships production deps and no tsx/scripts.
  #   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: build
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    command: ["node_modules/.bin/tsx", "scripts/seed-demo.ts"]
    env_file: ${DEALFLOW_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy

