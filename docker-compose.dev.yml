# Local/dev overrides. Deliberately NOT named docker-compose.override.yml: an override file is
# auto-merged into every `docker compose up`, which would leak these host-port settings onto the
# production box. Opt in explicitly instead:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# The base file already publishes the app, ws and the MinIO S3 API on loopback; this file only
# adds the two debug ports (Postgres for clients, the MinIO console for browsing buckets).
services:
  postgres:
    ports: ["${DEV_PG_PORT:-5433}:5432"]

  minio:
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
