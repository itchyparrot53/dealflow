# Single-box topology: app, WebSocket server, worker, Postgres and MinIO. There is NO reverse
# proxy in this stack: the app, ws and MinIO publish on loopback and the owner's own proxy (Caddy,
# nginx, Traefik) fronts them on one domain plus an s3. subdomain. See docs/reverse-proxy.md.
#
# `docker compose up -d --build` brings up everything; migrations and the bucket are one-shot
# services. For local dev, opt into docker-compose.dev.yml explicitly (`-f docker-compose.yml
# -f docker-compose.dev.yml`); it is deliberately NOT named docker-compose.override.yml so its
# debug ports never auto-merge here. See docs/deploy.md.

# Shared build config: pass NEXT_PUBLIC_WS_URL as a build arg so Next inlines it into the client
# bundle at build time (F29). A runtime-only env_file does NOT reach the client bundle.
x-app-build: &app-build
  context: .
  args:
    NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    # Optional version stamp for the update-check banner. Unset falls back to package.json, then "dev".
    APP_VERSION: ${APP_VERSION:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warpdrive}
      # Overridable, with the historical value as the fallback so existing boxes keep booting.
      # Postgres only applies this at initdb, so setting it against an EXISTING pgdata volume
      # does NOT rotate the password; it just makes DATABASE_URL wrong. Choose it on a fresh
      # deploy, and keep it identical to the password inside DATABASE_URL.
      # Not reachable from outside the box today (this service publishes no host port and the
      # owner's proxy is the only public listener), so the weak default is a defense-in-depth gap
      # rather than a live hole. It becomes a live hole the moment anyone adds a `ports:` mapping
      # here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warpdrive}
      POSTGRES_DB: ${POSTGRES_DB:-warpdrive}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warpdrive}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The official minio/minio image was withdrawn from Docker Hub and quay.io; pgsty/minio is a
    # community build of the same server. MINIO_IMAGE can point at another S3-compatible image.
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # Browser uploads/downloads hit MinIO cross-origin (app on APP_DOMAIN, storage on
      # s3.APP_DOMAIN), so the S3 API must return CORS headers or the upload fetch rejects.
      MINIO_API_CORS_ALLOW_ORIGIN: ${BASE_URL}
    # The S3 API is published on loopback for the owner's proxy; the console stays internal.
    ports: ["${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"]
    volumes: [miniodata:/data]

  # One-shot: create the app bucket idempotently and keep it private. The app itself never
  # creates the bucket, so on a fresh box uploads would fail without this step.
  createbuckets:
    # pgsty/mc is the client matching the community MinIO build above. MC_IMAGE can override it.
    image: ${MC_IMAGE:-pgsty/mc:latest}
    depends_on:
      minio:
        condition: service_started
    env_file: ${DEALFLOW_ENV_FILE:-.env}
    # $$VAR (not $VAR) so Compose passes the literal to the shell, which expands it from the
    # container env (env_file), not from the host at parse time.
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do
        echo 'waiting for minio'; sleep 2;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set none local/$$MINIO_BUCKET;
      "

  # One-shot: apply forward-only Drizzle migrations, then exit. Gates the long-running tier.
  migrate:
    build: *app-build
    command: ["node", "dist/migrate.mjs"]
    env_file: ${DEALFLOW_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: *app-build
    restart: unless-stopped
    command: ["node_modules/.bin/next", "start"]
    env_file: ${DEALFLOW_ENV_FILE:-.env}
    # Published on loopback by default: the proxy on this box connects from 127.0.0.1. Set
    # APP_BIND=0.0.0.0 (or a LAN address) only when the proxy runs on another machine, and firewall
    # this port in that case: the rate limiter trusts the proxy's X-Forwarded-For.
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully

  ws:
    build: *app-build
    restart: unless-stopped
    command: ["node", "dist/ws.mjs"]
    env_file: ${DEALFLOW_ENV_FILE:-.env}
    # Same loopback rule as the app: the proxy forwards /_ws* here.
    ports: ["${WS_BIND:-127.0.0.1}:${WS_HOST_PORT:-8080}:8080"]
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('node:net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: *app-build
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    env_file: ${DEALFLOW_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
